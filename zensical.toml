# --------------------------------------------------------------------------
#  Plugins
# --------------------------------------------------------------------------
# Blog: posts in docs/blog/posts/, authors in docs/blog/.authors.yml
[project.plugins.blog]
post_date_format = "long"
post_url_format = "{date}/{slug}"
post_readtime = true
pagination_per_page = 5        # post list, archive and category pages: 5 posts per page
archive_name = "Archive"
categories_name = "Categories"

# RSS and JSON feed (/feed_rss_created.xml, /feed_json_created.json):
# blog posts and Docs articles (subfolders of docs/docs/; the docs/docs/index.md overview is excluded).
# The JSON feed drives «Latest posts» on the home page and the /archive/ page
[project.plugins.rss]
match_path = "blog/posts/.*|docs/[^/]+/.*"
length = 1000                 # all entries, so the archive is complete
use_git = false
date_from_meta.as_creation = "date"
date_from_meta.as_update = "date"
categories = ["categories", "tags"]

# Tags in posts and articles; the full tag list is docs/tags.md
[project.plugins.tags]

# --------------------------------------------------------------------------
#  Markdown
# --------------------------------------------------------------------------
[project.markdown_extensions]
# Python-Markdown
attr_list = {}                # { .md-button } and { target=_blank }
md_in_html = {}               # markdown inside <div markdown>
admonition = {}               # !!! note / tip / warning
def_list = {}                 # definition lists
footnotes = {}                # footnotes [^1]
toc.permalink = true
# PyMdown Extensions
pymdownx.details = {}                     # collapsible blocks ???
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.keys = {}                        # keys ++ctrl+k++
pymdownx.superfences.custom_fences = [    # ```mermaid → Mermaid diagram
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true    # tabs === "..."
pymdownx.tasklist.custom_checkbox = true  # checkboxes - [x]
pymdownx.tasklist.clickable_checkbox = true  # can be ticked; state kept per page by js/checklists.js
