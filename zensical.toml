# --------------------------------------------------------------------------
#  Theme
# --------------------------------------------------------------------------
[project.theme]
variant = "modern"
custom_dir = "overrides"      # custom templates: meta tags, 404, blog, article dates, Share buttons
favicon = "img/favicon.svg"
logo = "img/favicon.svg"
language = "en"
features = [
  "navigation.tabs",          # site sections as tabs in the header
  "navigation.sections",      # Docs topics as groups in the left menu
  "navigation.indexes",       # a topic's index.md is the topic page itself
  "navigation.path",          # breadcrumbs above the article
  "navigation.footer",        # «Previous / Next» at the bottom of the page
  "navigation.instant",       # page transitions without a reload
  "navigation.top",           # «back to top» button
  "toc.follow",               # the right-hand TOC highlights the current section
  "search.highlight",
  "content.code.copy",
]

# "custom" colors are defined in docs/css/base.css (--md-primary-fg-color etc.)
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "material/lightbulb-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/lightbulb"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/lightbulb-outline"
toggle.name = "Switch to system preference"

