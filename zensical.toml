# --------------------------------------------------------------------------
#  Тема
# --------------------------------------------------------------------------
[project.theme]
variant = "modern"
custom_dir = "overrides"      # власні шаблони: мета-теги, 404, блог, дати статей, кнопки Share
favicon = "img/favicon.svg"
logo = "img/favicon.svg"
language = "en"
features = [
  "navigation.tabs",          # розділи сайту вкладками в шапці
  "navigation.sections",      # теми Docs групами в лівому меню
  "navigation.indexes",       # index.md теми — сторінка самої теми
  "navigation.path",          # «хлібні крихти» над статтею
  "navigation.footer",        # «Previous / Next» внизу сторінки
  "navigation.instant",       # переходи без перезавантаження сторінки
  "navigation.top",           # кнопка «вгору»
  "toc.follow",               # зміст справа підсвічує поточний розділ
  "search.highlight",
  "content.code.copy",
]

# Кольори "custom" задаються в docs/css/base.css (--md-primary-fg-color тощо)
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "material/lightbulb-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/lightbulb"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/lightbulb-outline"
toggle.name = "Switch to system preference"

# --------------------------------------------------------------------------
#  Футер
# --------------------------------------------------------------------------
[project.extra]
generator = false             # без «Made with Zensical»

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/serhiismetanskyi"
name = "GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/serhiismetanskyi"
name = "LinkedIn"

[[project.extra.social]]
icon = "fontawesome/brands/telegram"
link = "https://t.me/serhiismetanskyi"
name = "Telegram"

[[project.extra.social]]
icon = "fontawesome/brands/medium"
link = "https://serhiismetanskyi.medium.com/"
name = "Medium"

[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:smetanskyi@proton.me"
name = "Email"

# --------------------------------------------------------------------------
#  Плагіни
# --------------------------------------------------------------------------
# Блог: пости в docs/blog/posts/, автори в docs/blog/.authors.yml
[project.plugins.blog]
post_date_format = "long"
post_url_format = "{date}/{slug}"
post_readtime = true
archive_name = "Archive"
categories_name = "Categories"

# RSS і JSON-стрічка (/feed_rss_created.xml, /feed_json_created.json):
# пости блогу й статті Docs (підпапки docs/docs/; огляд docs/docs/index.md не потрапляє).
# З JSON-стрічки будуються «Latest posts» на головній і сторінка /archive/
[project.plugins.rss]
match_path = "blog/posts/.*|docs/[^/]+/.*"
length = 1000                 # усі записи — щоб архів був повним
use_git = false
date_from_meta.as_creation = "date"
date_from_meta.as_update = "date"
categories = ["categories", "tags"]

# Теги в постах і статтях; список усіх тегів — docs/tags.md
[project.plugins.tags]

# --------------------------------------------------------------------------
#  Markdown
# --------------------------------------------------------------------------
[project.markdown_extensions]
# Python-Markdown
attr_list = {}                # { .md-button } та { target=_blank }
md_in_html = {}               # markdown всередині <div markdown>
admonition = {}               # !!! note / tip / warning
def_list = {}                 # списки визначень
footnotes = {}                # виноски [^1]
toc.permalink = true
# PyMdown Extensions
pymdownx.details = {}                     # згортувані блоки ???
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.keys = {}                        # клавіші ++ctrl+k++
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true    # вкладки === "..."
pymdownx.tasklist.custom_checkbox = true  # чекбокси - [x]
