[project]
site_name = "Serhii Smetanskyi"
site_url = "https://serhiismetanskyi.com/"   # Share buttons, RSS, social previews, JSON-LD; also in docs/robots.txt
site_description = "Serhii Smetanskyi, Software Test & Automation Engineer: a blog and knowledge base on QA, test automation, API testing and testing LLMs and AI agents."
site_author = "Serhii Smetanskyi"
copyright = "&copy; 2026 Serhii Smetanskyi"

# Styles per site section (docs/css/); base.css goes first
extra_css = [
  "css/base.css",    # colors, links, buttons, navigation, print
  "css/home.css",    # home page
  "css/blog.css",    # blog, post, yearly archive
  "css/docs.css",    # knowledge base
  "css/pages.css",   # About, Contact, Tags, Archive, 404
  "css/cv.css",      # CV and print to PDF
]

# Scripts (docs/js/); feed.js is a shared helper, so it comes before the page scripts below
extra_javascript = [
  "js/reading-progress.js",   # reading progress bar in posts
  "js/feed.js",               # loading the site's JSON feed
  "js/latest.js",             # latest posts and docs on the home page
  "js/archive.js",            # the /archive/ page
  "js/blog-tags.js",          # «Tags» section in the blog's left menu
  "js/docs-search.js",        # search on the /docs/ overview
  "js/tags-filter.js",        # filters on the /tags/ page
  "js/share.js",              # «Copy link» button in the Share block
  "js/related.js",            # «Related reading» under blog posts
  "js/paginate.js",           # page numbers for the project lists
  "js/checklists.js",         # tickable checklists with progress, saved in the browser
  "js/footer-menu.js",        # hamburger for the footer's page links on mobile
]

