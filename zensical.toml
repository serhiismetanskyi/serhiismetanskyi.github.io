[project]
site_name = "Serhii Smetanskyi"
site_url = "https://example.com/"            # TODO: справжній домен (Share-кнопки, RSS, прев'ю в соцмережах)
site_description = "Personal website of a software engineer"
copyright = "&copy; 2026 Serhii Smetanskyi"

# Стилі по розділах сайту (docs/css/); base.css — першим
extra_css = [
  "css/base.css",    # кольори, посилання, кнопки, навігація, друк
  "css/home.css",    # головна
  "css/blog.css",    # блог, пост, архів за роками
  "css/docs.css",    # база знань
  "css/pages.css",   # About, Contact, Tags, Archive, 404
  "css/cv.css",      # резюме й друк у PDF
]

# Скрипти (docs/js/); feed.js — спільний помічник, тому перед latest-posts.js і archive.js
extra_javascript = [
  "js/reading-progress.js",   # смужка прогресу читання в постах
  "js/feed.js",               # завантаження JSON-стрічки сайту
  "js/latest-posts.js",       # останні пости на головній
  "js/archive.js",            # сторінка /archive/
]

