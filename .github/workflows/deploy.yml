name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # uv also installs Python from .python-version
      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Zensical and linters (uv.lock)
        run: make install

      # Same as `make check` locally: Biome, djLint, then a strict build into site/
      - name: Lint and build (strict)
        run: make check

      # Pages that are new or changed compared with the live sitemap, for IndexNow after the deploy (scripts/indexnow.py)
      - name: List changed pages for IndexNow
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python3 scripts/indexnow.py changed site/sitemap.xml > indexnow-urls.txt

      - name: Upload the IndexNow list
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: indexnow-urls.txt
          retention-days: 1

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Bing, Yandex and other IndexNow engines learn about new and updated pages right after the deploy.
  # Never fails the workflow: problems show up as warnings
  indexnow:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Download the IndexNow list
        uses: actions/download-artifact@v4
        with:
          name: indexnow-urls

      - name: Submit to IndexNow
        run: python3 scripts/indexnow.py submit indexnow-urls.txt
